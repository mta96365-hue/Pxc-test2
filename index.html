<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d; --card-bg: #1a1a1a; --input-bg: #262626; --text: #f0f0f0; --text-muted: #9e9e9e;      
            --primary: #e3000f; --primary-hover: #ff1a2b; --primary-glow: rgba(227, 0, 15, 0.4); 
            --secondary: #333333; --border-color: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        header { 
            padding: 20px; text-align: center; width: 100%; border-bottom: 2px solid var(--border-color);
            background-color: rgba(13, 13, 13, 0.9); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .lang-toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding: 20px 0; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .intro-card { background: var(--card-bg); width: 90%; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        
        #video-container { position: relative; width: 90%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .input-group { width: 90%; display: flex; gap: 10px; margin-top: 15px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; padding: 12px; outline: none; }
        
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 48px; height: 48px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
        #send-btn { border-color: var(--primary); color: var(--primary); }

        .btn-full { width: 90%; padding: 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; text-transform: uppercase; }
        .btn-next { background: var(--primary); color: #fff; }
        .btn-back { background: var(--secondary); color: #ccc; }

        #result-box { width: 90%; background: #000; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid var(--primary); min-height: 50px; }
        #result-box img { max-width: 100%; border-radius: 4px; margin-top: 10px; border: 1px solid #444; }
        
        .settings-container { width: 90%; background: var(--input-bg); padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.8rem; }
        .loading { color: var(--primary); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <button id="lang-toggle" class="lang-toggle">EN</button>
        <h1 style="margin:0; font-size: 1.5rem; letter-spacing: 2px;">PHOENIX TUTOR</h1>
        <div id="ui-subtitle" style="color: var(--primary); font-size: 0.8rem; font-family: monospace;">SYS.MODULE // BLINK_INIT</div>
    </header>

    <div id="intro-screen" class="screen active">
        <div class="intro-card">
            <h2 id="key-card-title">🔑 API-Key</h2>
            <input type="password" id="api-key-input" placeholder="Gemini API Key..." style="width:100%; padding:10px; box-sizing:border-box; background:#000; border:1px solid #444; color:#0f0;">
        </div>
        <button id="to-sim-btn" class="btn-full btn-next">Zum Simulator ➤</button>
    </div>

    <div id="simulator-screen" class="screen">
        <div class="intro-card" style="width:95%;">
            <h2 id="ui-s2-title">Virtual Test</h2>
            <div style="width:100%; height:400px; background:#000;">
                <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
        <button id="to-camera-btn" class="btn-full btn-next">Hardware Check ➤</button>
        <button id="back-to-intro-btn" class="btn-full btn-back">Zurück</button>
    </div>

    <div id="tutor-screen" class="screen">
        <div id="video-container"><video id="webcam" autoplay playsinline></video></div>
        
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag den Tutor...">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="voice-btn" class="icon-btn">🎤</button>
        </div>

        <div class="settings-container">
            <div>VOICE: <select id="voice-select" style="background:#000; color:#fff; border:1px solid #444;"></select></div>
            <div style="margin-top:5px;">SPEED: <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1.2"> <span id="speed-val">1.2x</span></div>
        </div>

        <div id="result-box">SYSTEM READY...</div>
        <button id="back-to-sim-btn" class="btn-full btn-back" style="margin-top:20px;">Zurück</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const state = {
            lang: 'de',
            apiKey: localStorage.getItem('phoenix_api_key') || '',
            voices: []
        };

        if (state.apiKey) document.getElementById('api-key-input').value = state.apiKey;

        // Navigation
        const show = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        document.getElementById('to-sim-btn').onclick = () => show('simulator-screen');
        document.getElementById('to-camera-btn').onclick = () => { show('tutor-screen'); startCam(); };
        document.getElementById('back-to-intro-btn').onclick = () => show('intro-screen');
        document.getElementById('back-to-sim-btn').onclick = () => show('simulator-screen');

        document.getElementById('api-key-input').oninput = (e) => {
            state.apiKey = e.target.value;
            localStorage.setItem('phoenix_api_key', state.apiKey);
        };

        async function startCam() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (err) { alert("Kamerafehler"); }
        }

        // Sprachausgabe Initialisierung
        function loadVoices() {
            state.voices = window.speechSynthesis.getVoices();
            const sel = document.getElementById('voice-select');
            sel.innerHTML = state.voices
                .filter(v => v.lang.startsWith(state.lang))
                .map(v => `<option value="${v.name}">${v.name}</option>`).join('');
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/!\[.*?\]\(.*?\)/g, "").replace(/```[\s\S]*?
```/g, "");
            const utt = new SpeechSynthesisUtterance(cleanText);
            const voiceName = document.getElementById('voice-select').value;
            utt.voice = state.voices.find(v => v.name === voiceName);
            utt.rate = document.getElementById('speed-slider').value;
            utt.lang = state.lang === 'de' ? 'de-DE' : 'en-US';
            window.speechSynthesis.speak(utt);
        }

        // KI Logik
        async function askAI(q) {
            if (!state.apiKey) return alert("Bitte API Key eintragen!");
            
            const resBox = document.getElementById('result-box');
            resBox.innerHTML = '<span class="loading">ANALYSING...</span>';

            const canvas = document.getElementById('canvas');
            const video = document.getElementById('webcam');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

            const prompt = `Du bist der PHOENIX Tutor. Antworte auf: "${q}".
            REGELN:
            1. Wenn nach Hardware/Bauteilen gefragt wird, zeige ein Bild so: ![bild](https://images.unsplash.com/featured/?electronics,[bauteil])
            2. Nutze IMMER die Markdown Syntax OHNE Leerzeichen: ![alt](url)
            3. Code in \`\`\`cpp Block.
            4. Sprache: ${state.lang === 'de' ? 'Deutsch' : 'Englisch'}.`;

            try {
                const genAI = new GoogleGenerativeAI(state.apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });
                const result = await model.generateContent([prompt, { inlineData: { data: imgData, mimeType: "image/jpeg" } }]);
                const text = result.response.text();

                resBox.innerHTML = marked.parse(text);
                Prism.highlightAllUnder(resBox);
                speak(text);
            } catch (err) {
                resBox.innerHTML = "Fehler: " + err.message;
            }
        }

        document.getElementById('send-btn').onclick = () => askAI(document.getElementById('text-input').value);
        document.getElementById('speed-slider').oninput = (e) => document.getElementById('speed-val').innerText = e.target.value + "x";

        // Voice Recognition
        const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Reco) {
            const reco = new Reco();
            document.getElementById('voice-btn').onclick = () => {
                reco.lang = state.lang === 'de' ? 'de-DE' : 'en-US';
                reco.start();
                document.getElementById('result-box').innerHTML = "🎤 LISTENING...";
            };
            reco.onresult = (e) => {
                const val = e.results[0][0].transcript;
                document.getElementById('text-input').value = val;
                askAI(val);
            };
        }
    </script>
</body>
</html>
