<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d;              
            --card-bg: #1a1a1a;         
            --input-bg: #262626;        
            --text: #f0f0f0;            
            --text-muted: #9e9e9e;      
            --primary: #e3000f;         
            --primary-hover: #ff1a2b;   
            --primary-glow: rgba(227, 0, 15, 0.4); 
            --secondary: #333333;       
            --secondary-hover: #4d4d4d;
            --border-color: #333333;
        }

        body { 
            font-family: 'Segoe UI', 'Roboto', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        header { 
            position: relative; padding: 25px 15px 15px 15px; text-align: center; width: 100%; box-sizing: border-box; 
            border-bottom: 2px solid var(--border-color); background-color: rgba(13, 13, 13, 0.9); box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px;
        }

        .lang-toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding-bottom: 40px; }
        .screen.active { display: flex; animation: fadeInSlide 0.4s ease-out; }
        @keyframes fadeInSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .intro-card { background: var(--card-bg); width: 90%; border-radius: 8px; padding: 25px; margin-bottom: 25px; border-left: 4px solid var(--primary); border: 1px solid var(--border-color); }
        
        #video-container { position: relative; width: 90%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background-color: #000; border: 2px solid var(--primary); }
        video { width: 100%; height: 100%; object-fit: cover; }

        .input-group { width: 90%; display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text); padding: 15px; outline: none; }
        
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: 0.2s; }
        #send-btn { color: var(--primary); border-color: var(--primary); }

        .btn-full { width: 90%; padding: 18px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer; margin-bottom: 15px; text-transform: uppercase; }
        .btn-next { background: var(--primary); color: #fff; }
        .btn-back { background: var(--secondary); color: var(--text); }

        #result-box { width: 90%; background: #0d0d0d; padding: 20px; border-radius: 6px; margin-top: 20px; border-left: 4px solid var(--primary); line-height: 1.6; border: 1px solid var(--border-color); }
        #result-box img { max-width: 100%; border-radius: 6px; margin: 12px auto; display: block; border: 2px solid var(--border-color); }

        .settings-container { width: 90%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; background: var(--input-bg); padding: 15px; border-radius: 6px; }
        .loading { color: var(--primary); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <button id="lang-toggle" class="lang-toggle">EN</button>
        <h1>Phoenix Tutor</h1>
        <div id="ui-subtitle" style="color: var(--primary); font-size: 0.95rem; font-family: monospace;">SYS.MODULE // VERSUCH 1: BLINK</div>
    </header>

    <div id="intro-screen" class="screen active">
        <div class="intro-card" style="border-left-color: #00ff00;">
            <h2 id="key-card-title">🔑 API-Key Konfiguration</h2>
            <input type="password" id="api-key-input" placeholder="Google Gemini API-Key..." style="width: 100%; background: #000; border: 1px solid #444; border-radius: 4px; padding: 12px; color: #00ff00; font-family: monospace;">
        </div>
        <button id="to-sim-btn" class="btn-full btn-next">Simulator starten ➤</button>
    </div>

    <div id="simulator-screen" class="screen">
        <div class="intro-card" style="width: 95%;">
            <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb" style="width:100%; height:500px; border:none;"></iframe>
        </div>
        <button id="to-camera-btn" class="btn-full btn-next">Hardware-Check starten ➤</button>
        <button id="back-to-intro-btn" class="btn-full btn-back">Zurück</button>
    </div>

    <div id="tutor-screen" class="screen">
        <div id="video-container"><video id="webcam" autoplay playsinline></video></div>
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag mich was...">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="voice-btn" class="icon-btn">🎤</button>
        </div>

        <div class="settings-container">
            <div>STIMME: <select id="voice-select" style="background:#000; color:#fff;"></select></div>
            <div>TEMPO: <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1.2"> <span id="speed-val">1.2x</span></div>
        </div>

        <div id="result-box">SYSTEM READY...</div>
        <button id="back-to-sim-btn" class="btn-full btn-back" style="margin-top:20px;">Zurück</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const apiKeyInput = document.getElementById('api-key-input');
        const video = document.getElementById('webcam');
        const resultBox = document.getElementById('result-box');
        const textInput = document.getElementById('text-input');
        
        let currentLang = 'de';
        let voices = [];

        // Navigation
        const show = id => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        document.getElementById('to-sim-btn').onclick = () => show('simulator-screen');
        document.getElementById('to-camera-btn').onclick = () => { show('tutor-screen'); startCamera(); };
        document.getElementById('back-to-intro-btn').onclick = () => show('intro-screen');
        document.getElementById('back-to-sim-btn').onclick = () => show('simulator-screen');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (err) { resultBox.innerText = "Kamera-Fehler"; }
        }

        // Sprachausgabe
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            const sel = document.getElementById('voice-select');
            sel.innerHTML = voices.filter(v => v.lang.startsWith(currentLang)).map(v => `<option value="${v.name}">${v.name}</option>`).join('');
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/!\[.*?\]\(.*?\)/g, "").replace(/```[\s\S]*?
```/g, "");
            const ut = new SpeechSynthesisUtterance(cleanText);
            ut.rate = document.getElementById('speed-slider').value;
            ut.voice = voices.find(v => v.name === document.getElementById('voice-select').value);
            window.speechSynthesis.speak(ut);
        }

        // KI Abfrage
        async function runAI(q) {
            const key = apiKeyInput.value || localStorage.getItem('phoenix_api_key');
            if(!key) return alert("API Key fehlt!");
            localStorage.setItem('phoenix_api_key', key);

            resultBox.innerHTML = '<span class="loading">VERARBEITE...</span>';
            
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const b64Img = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

            const systemPrompt = `Du bist der "Phoenix Tutor". Antworte auf: "${q}".
            ANWEISUNGEN:
            1. Wenn nach Bauteilen gefragt wird (LED, Arduino, etc.), füge ein Bild ein: ![bauteil](https://images.unsplash.com/featured/?electronics,[bauteil])
            2. NIEMALS ein Leerzeichen zwischen ! und [ !
            3. Code in \`\`\`cpp Blöcken.
            4. Sprache: ${currentLang === 'de' ? 'Deutsch' : 'Englisch'}.`;

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });
                const res = await model.generateContent([systemPrompt, { inlineData: { data: b64Img, mimeType: "image/jpeg" } }]);
                const text = res.response.text();

                resultBox.innerHTML = marked.parse(text);
                Prism.highlightAllUnder(resultBox);
                speak(text);
            } catch (e) { resultBox.innerText = "Fehler: " + e.message; }
        }

        document.getElementById('send-btn').onclick = () => runAI(textInput.value);
        document.getElementById('speed-slider').oninput = e => document.getElementById('speed-val').innerText = e.target.value + "x";

        // Voice Rec
        const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(Reco) {
            const reco = new Reco();
            document.getElementById('voice-btn').onclick = () => { reco.start(); resultBox.innerText = "Höre zu..."; };
            reco.onresult = e => { textInput.value = e.results[0][0].transcript; runAI(textInput.value); };
        }
    </script>
</body>
</html>
