<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d;              
            --card-bg: #1a1a1a;         
            --input-bg: #262626;        
            --text: #f0f0f0;            
            --text-muted: #9e9e9e;      
            --primary: #e3000f;         
            --primary-hover: #ff1a2b;   
            --primary-glow: rgba(227, 0, 15, 0.4); 
            --secondary: #333333;       
            --secondary-hover: #4d4d4d;
            --border-color: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        header { 
            padding: 25px 15px; text-align: center; width: 100%; box-sizing: border-box; 
            border-bottom: 2px solid var(--border-color); background-color: rgba(13, 13, 13, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative;
        }

        .lang-toggle {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-family: monospace;
        }
        
        .app-logo { max-width: 120px; filter: drop-shadow(0 0 10px var(--primary-glow)); }
        
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding-bottom: 40px; }
        .screen.active { display: flex; animation: fadeInSlide 0.4s ease-out; }
        @keyframes fadeInSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .intro-card { 
            background: var(--card-bg); width: 90%; border-radius: 8px; padding: 25px; box-sizing: border-box; 
            margin-bottom: 25px; border: 1px solid var(--border-color); border-left: 4px solid var(--primary);
        }

        .iframe-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        iframe { width: 100%; height: 500px; border: none; }

        #video-container { position: relative; width: 90%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #schematic-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        #schematic-overlay.active { display: flex; }

        .input-group { width: 90%; display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text); padding: 15px; outline: none; }
        
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
        #send-btn { color: var(--primary); border-color: var(--primary); }

        .btn-full { width: 90%; padding: 18px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .btn-next { background: var(--primary); color: #fff; }
        .btn-back { background: var(--secondary); color: var(--text); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        #result-box { 
            width: 90%; background: #0d0d0d; padding: 20px; border-radius: 6px; margin-top: 20px; 
            border-left: 4px solid var(--primary); line-height: 1.6; word-break: break-word; 
        }
        #result-box img { max-width: 100%; border-radius: 6px; margin: 10px 0; border: 1px solid var(--border-color); }
        #result-box pre { background: #151515 !important; padding: 15px; border-radius: 6px; overflow-x: auto; }

        .settings-container { width: 90%; background: var(--input-bg); padding: 15px; border-radius: 6px; margin-top: 10px; }
        .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .settings-label { color: var(--text-muted); font-size: 0.8rem; width: 60px; }
        select, input[type=range] { flex: 1; background: var(--card-bg); color: var(--text); border: 1px solid var(--border-color); }
        
        .loading { color: var(--primary); animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <button id="lang-toggle" class="lang-toggle">EN</button>
        <img src="logo.png" alt="Logo" class="app-logo" onerror="this.src='https://placehold.co/150x150/1a1a1a/e3000f?text=P.H.O.E.N.I.X'">
        <h1>Phoenix Tutor</h1>
        <div id="ui-subtitle" style="color: var(--primary); font-size: 0.95rem; font-family: monospace;">SYS.MODULE // VERSUCH 1: BLINK</div>
    </header>

    <div id="intro-screen" class="screen active">
        <div class="intro-card" style="border-left-color: #00ff00;">
            <h2 id="key-card-title">🔑 API-Key Konfiguration</h2>
            <input type="password" id="api-key-input" placeholder="Google Gemini API-Key..." style="width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; color: #00ff00; outline: none;">
        </div>
        <div class="intro-card">
            <h2 id="ui-s1-title">Schritt 1: Hardware</h2>
            <ul style="color: var(--text-muted);">
                <li id="ui-s1-l1">Arduino Uno</li>
                <li id="ui-s1-l2">Breadboard</li>
                <li id="ui-s1-l3">LED & 220Ω Widerstand</li>
            </ul>
        </div>
        <button id="to-sim-btn" class="btn-full btn-next">Simulator starten ➤</button>
    </div>

    <div id="simulator-screen" class="screen">
        <div class="intro-card" style="width: 95%;">
            <h2 id="ui-s2-title">Schritt 2: Virtual Test</h2>
            <div class="iframe-container">
                <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb?editbtn=1" allowfullscreen></iframe>
            </div>
        </div>
        <button id="to-camera-btn" class="btn-full btn-next">Hardware-Check starten ➤</button>
        <button id="back-to-intro-btn" class="btn-full btn-back">← Zurück</button>
    </div>

    <div id="tutor-screen" class="screen">
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="schematic-overlay">
                <img src="mein-eigener-schaltplan.jpg" alt="Schaltplan" style="width: 100%; border-radius: 4px;" onerror="this.src='https://placehold.co/400x300/1a1a1a/e3000f?text=SCHALTPLAN'">
                <button id="close-schematic" class="btn-full btn-back" style="margin-top:15px;">✖ Schließen</button>
            </div>
        </div>

        <button id="show-schematic-btn" class="btn-full btn-outline" style="margin-top:10px;">📊 Schaltplan zeigen</button>

        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag mich was..." autocomplete="off">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="voice-btn" class="icon-btn">🎤</button>
        </div>

        <div class="settings-container">
            <div class="settings-row">
                <span class="settings-label">STIMME:</span>
                <select id="voice-select"><option value="default">System Default</option></select>
            </div>
            <div class="settings-row">
                <span class="settings-label">TEMPO:</span>
                <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.2">
            </div>
        </div>

        <div id="result-box">BEREIT...</div>
        <!-- DER NEUE VORLESE BUTTON -->
        <button id="read-aloud-btn" class="btn-full btn-outline" style="display: none; border-color: #00ff00; color: #00ff00;">🔊 Antwort vorlesen</button>
        
        <button id="back-to-sim-btn" class="btn-full btn-back" style="margin-top: 20px;">← Zurück</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const keyInput = document.getElementById('api-key-input');
        if (localStorage.getItem('phoenix_api_key')) keyInput.value = localStorage.getItem('phoenix_api_key');
        keyInput.oninput = () => localStorage.setItem('phoenix_api_key', keyInput.value);

        const video = document.getElementById('webcam');
        const resultBox = document.getElementById('result-box');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const readAloudBtn = document.getElementById('read-aloud-btn');
        const voiceSelect = document.getElementById('voice-select');
        const speedSlider = document.getElementById('speed-slider');
        const canvas = document.getElementById('canvas');
        
        let currentStream = null;
        let currentLang = 'de';
        let allVoices = [];
        let lastResponseText = ""; // Speicher für die Sprachausgabe

        // Sprach-Daten
        const i18n = {
            de: { btn_read: "🔊 Antwort vorlesen", processing: "VERARBEITE...", sys_ready: "BEREIT...", placeholder: "Wie verbinde ich die LED?" },
            en: { btn_read: "🔊 Read Aloud", processing: "PROCESSING...", sys_ready: "READY...", placeholder: "How to connect the LED?" }
        };

        // Stimmen laden
        function populateVoiceList() {
            allVoices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            const filtered = allVoices.filter(v => v.lang.startsWith(currentLang));
            (filtered.length ? filtered : allVoices).forEach(v => {
                const opt = document.createElement('option');
                opt.textContent = v.name;
                opt.setAttribute('data-name', v.name);
                voiceSelect.appendChild(opt);
            });
        }
        window.speechSynthesis.onvoiceschanged = populateVoiceList;

        // Navigation & Kamera
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        document.getElementById('to-sim-btn').onclick = () => showScreen('simulator-screen');
        document.getElementById('to-camera-btn').onclick = async () => {
            showScreen('tutor-screen');
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = currentStream;
        };

        // KI Logik
        async function runTutor(q) {
            const apiKey = localStorage.getItem('phoenix_api_key');
            if (!apiKey) return alert("Bitte API-Key eingeben!");

            window.speechSynthesis.cancel();
            readAloudBtn.style.display = "none";
            resultBox.innerHTML = `<span class="loading">${i18n[currentLang].processing}</span>`;
            
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const base64Img = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

            const prompt = `Du bist der Phoenix Tutor für Arduino. Beantworte kurz und schülerfreundlich auf ${currentLang === 'de' ? 'Deutsch' : 'Englisch'}: ${q}. 
            Nutze Markdown für Fett und Listen. Wenn nach Hardware-Aussehen gefragt wird, nutze: ![component](https://images.unsplash.com/featured/?component)`;

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });
                const res = await model.generateContent([prompt, { inlineData: { data: base64Img, mimeType: "image/jpeg" } }]);
                
                lastResponseText = await res.response.text();
                resultBox.innerHTML = marked.parse(lastResponseText);
                Prism.highlightAllUnder(resultBox);
                
                // Button zum Vorlesen aktivieren
                readAloudBtn.innerHTML = i18n[currentLang].btn_read;
                readAloudBtn.style.display = "flex";
            } catch (e) { resultBox.innerHTML = "Fehler: " + e.message; }
        }

        // Sprachausgabe mit Filter
        function speak(text) {
            window.speechSynthesis.cancel();
            
            // CLEAN FILTER: Entfernt Markdown-Sonderzeichen für die Stimme
            let clean = text
                .replace(/!\[.*?\]\(.*?\)/g, "") // Bilder weg
                .replace(/```[\s\S]*?
```/g, "")   // Code weg
                .replace(/\*\*/g, "")             // Fett-Sterne weg
                .replace(/\*/g, "")               // Kursiv-Sterne weg
                .replace(/#/g, "")                // Headlines weg
                .replace(/-/g, "");               // Striche weg

            const utterance = new SpeechSynthesisUtterance(clean);
            utterance.lang = currentLang === 'de' ? 'de-DE' : 'en-US';
            utterance.rate = parseFloat(speedSlider.value);

            const sel = voiceSelect.options[voiceSelect.selectedIndex];
            if (sel) {
                const voice = allVoices.find(v => v.name === sel.getAttribute('data-name'));
                if (voice) utterance.voice = voice;
            }
            window.speechSynthesis.speak(utterance);
        }

        // Event Listener
        sendBtn.onclick = () => runTutor(textInput.value);
        readAloudBtn.onclick = () => speak(lastResponseText);
        
        // Mikrofon
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Recognition) {
            const rec = new Recognition();
            voiceBtn.onclick = () => { rec.lang = currentLang === 'de' ? 'de-DE' : 'en-US'; rec.start(); };
            rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; runTutor(textInput.value); };
        }

        document.getElementById('show-schematic-btn').onclick = () => document.getElementById('schematic-overlay').classList.add('active');
        document.getElementById('close-schematic').onclick = () => document.getElementById('schematic-overlay').classList.remove('active');
        document.getElementById('lang-toggle').onclick = () => { currentLang = currentLang === 'de' ? 'en' : 'de'; populateVoiceList(); };
    </script>
</body>
</html>
