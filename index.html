<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    
    <!-- ENGINES -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d; --card-bg: #1a1a1a; --text: #f0f0f0;            
            --primary: #e3000f; --accent: #00ff00;
        }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; text-align: center; }
        header { padding: 20px; border-bottom: 2px solid #333; background: #111; }
        
        /* NAVIGATION */
        .screen { width: 100%; max-width: 600px; display: none; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .screen.active { display: block; }
        
        .card { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); text-align: left; }
        
        .btn-full { width: 100%; padding: 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; background: var(--primary); color: white; }
        .btn-back { background: #333; margin-top: 20px; }
        
        iframe { width: 100%; height: 450px; border: none; border-radius: 8px; background: white; }
        #video-container { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; padding: 15px; border-radius: 6px; border: 1px solid #333; background: #222; color: white; }
        #result-box { background: #000; padding: 15px; border-radius: 6px; margin-top: 20px; border-left: 4px solid var(--primary); text-align: left; line-height: 1.6; }
        
        #speak-btn { display: none; margin-bottom: 10px; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0;">PHOENIX TUTOR</h1>
        <small style="color: var(--primary);">VERSUCH 1: BLINK</small>
    </header>

    <!-- SCREEN 1 -->
    <div id="screen-setup" class="screen active">
        <div class="card">
            <h3>🔑 API Setup</h3>
            <input type="password" id="api-key-input" placeholder="Key hier einfügen..." style="width:100%; padding:10px; box-sizing:border-box;">
            <p><a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:red; font-size:12px;">➔ Kostenlosen Key hier holen</a></p>
        </div>
        <div class="card">
            <h3>📋 Infos</h3>
            <p>Ziel: LED blinken lassen.</p>
        </div>
        <button onclick="nav('screen-sim')" class="btn-full">Zum Simulator ➤</button>
    </div>

    <!-- SCREEN 2 -->
    <div id="screen-sim" class="screen">
        <div class="card" style="padding:5px;">
            <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb?editbtn=1"></iframe>
        </div>
        <button onclick="startCam()" class="btn-full">Hardware-Check ➤</button>
        <button onclick="nav('screen-setup')" class="btn-full btn-back">Zurück</button>
    </div>

    <!-- SCREEN 3 -->
    <div id="screen-tutor" class="screen">
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag mich was...">
            <button id="send-btn" style="padding:15px; background:red; color:white; border:none; border-radius:6px;">OK</button>
        </div>
        <div id="result-box">
            <button id="speak-btn">🔊 VORLESEN</button>
            <div id="output">WARTE...</div>
        </div>
        <button onclick="stopCam()" class="btn-full btn-back">Zurück zum Simulator</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Globale Navigation
        window.nav = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        const keyField = document.getElementById('api-key-input');
        if(localStorage.getItem('p_key')) keyField.value = localStorage.getItem('p_key');
        keyField.oninput = () => localStorage.setItem('p_key', keyField.value);

        let stream = null;
        let lastRes = "";

        window.startCam = async function() {
            window.nav('screen-tutor');
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('webcam').srcObject = stream;
        };

        window.stopCam = function() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            window.nav('screen-sim');
        };

        async function askAI() {
            const k = localStorage.getItem('p_key');
            if(!k) return alert("Key fehlt!");
            
            const out = document.getElementById('output');
            const tin = document.getElementById('text-input');
            const v = document.getElementById('webcam');
            const c = document.getElementById('canvas');
            const spk = document.getElementById('speak-btn');

            out.innerHTML = "Phoenix denkt...";
            spk.style.display = "none";

            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const base64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];

            try {
                const genAI = new GoogleGenerativeAI(k);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });
                const prompt = "Du bist Phoenix Tutor. Hilf kurz auf Deutsch beim Arduino-Versuch. Frage: " + tin.value;
                
                const res = await model.generateContent([prompt, { inlineData: { data: base64, mimeType: "image/jpeg" } }]);
                lastRes = await res.response.text();
                
                out.innerHTML = marked.parse(lastRes);
                Prism.highlightAllUnder(out);
                spk.style.display = "block";
            } catch(e) { out.innerText = "Fehler: " + e.message; }
        }

        document.getElementById('send-btn').onclick = askAI;
        document.getElementById('speak-btn').onclick = () => {
            window.speechSynthesis.cancel();
            let clean = lastRes.replace(/!\[.*?\]\(.*?\)/g, "").replace(/```[\s\S]*?
```/g, "Code in Box.").replace(/[*#_`]/g, "");
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'de-DE';
            window.speechSynthesis.speak(u);
        };
    </script>
</body>
</html>
