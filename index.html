<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- ENGINES -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d; --card-bg: #1a1a1a; --input-bg: #262626; --text: #f0f0f0;            
            --primary: #e3000f; --border-color: #333333;
        }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { padding: 20px; text-align: center; width: 100%; border-bottom: 2px solid var(--border-color); background: rgba(13,13,13,0.9); }
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; }
        .intro-card { background: var(--card-bg); width: 100%; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); box-sizing: border-box; }
        .iframe-container { width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        iframe { width: 100%; height: 500px; border: none; }
        #video-container { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .input-group { width: 100%; display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; padding: 12px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 50px; height: 50px; cursor: pointer; color: white; font-size: 1.2rem; }
        .btn-full { width: 100%; padding: 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-next { background: var(--primary); color: white; }
        .btn-back { background: #333; color: white; }
        #result-box { width: 100%; background: #000; padding: 15px; border-radius: 6px; margin-top: 20px; border-left: 4px solid var(--primary); line-height: 1.6; }
        #result-box img { max-width: 100%; border-radius: 6px; margin: 10px 0; display: block; }
        #result-box pre { background: #151515 !important; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .loading { color: var(--primary); animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <h1>Phoenix Tutor</h1>
    </header>

    <div id="intro-screen" class="screen active">
        <div class="intro-card">
            <h2>🔑 API-Key</h2>
            <input type="password" id="api-key-input" placeholder="Gemini API-Key..." style="width:100%; padding:10px; background:#222; color:#00ff00; border:1px solid #444;">
        </div>
        <button id="to-sim-btn" class="btn-full btn-next">Simulator ➤</button>
    </div>

    <div id="simulator-screen" class="screen">
        <div class="intro-card">
            <h2>Simulator</h2>
            <div class="iframe-container">
                <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb?editbtn=1"></iframe>
            </div>
        </div>
        <button id="to-camera-btn" class="btn-full btn-next">Hardware-Check ➤</button>
        <button id="back-to-intro-btn" class="btn-full btn-back">Zurück</button>
    </div>

    <div id="tutor-screen" class="screen">
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frage eingeben...">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="voice-btn" class="icon-btn">🎤</button>
        </div>
        <div id="result-box">BEREIT...</div>
        <button id="back-to-sim-btn" class="btn-full btn-back">Zurück</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const keyInput = document.getElementById('api-key-input');
        if (localStorage.getItem('p_key')) keyInput.value = localStorage.getItem('p_key');
        keyInput.oninput = () => localStorage.setItem('p_key', keyInput.value);

        const video = document.getElementById('webcam');
        const resultBox = document.getElementById('result-box');
        const textInput = document.getElementById('text-input');
        const canvas = document.getElementById('canvas');
        let stream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('to-sim-btn').onclick = () => showScreen('simulator-screen');
        document.getElementById('to-camera-btn').onclick = async () => {
            showScreen('tutor-screen');
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        };
        document.querySelectorAll('.btn-back').forEach(b => b.onclick = () => showScreen('intro-screen'));

        async function run(q) {
            const key = localStorage.getItem('p_key');
            if (!key) return alert("Key fehlt!");
            
            window.speechSynthesis.cancel();
            resultBox.innerHTML = "<span class='loading'>Denke nach...</span>";
            
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const img = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

            const prompt = `Du bist Phoenix Tutor. Antworte kurz auf Deutsch zu: ${q}. 
            Für Bilder: ![bauteil](https://images.unsplash.com/featured/?[bauteil]). 
            Code in \`\`\`cpp \`\`\`.`;

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const res = await model.generateContent([prompt, { inlineData: { data: img, mimeType: "image/jpeg" } }]);
                const text = await res.response.text();
                
                resultBox.innerHTML = marked.parse(text);
                Prism.highlightAllUnder(resultBox);
                
                // --- TTS CLEANUP: Entfernt Markdown-Symbole vor dem Vorlesen ---
                let cleanText = text
                    .replace(/!\[.*?\]\(.*?\)/g, "") // Entfernt Bilder
                    .replace(/```[\s\S]*?
```/g, "Hier ist der passende Code.") // Ersetzt Code-Blöcke
                    .replace(/[*#_`]/g, "") // Entfernt Sternchen, Rauten, Unterstriche
                    .trim();
                
                const utt = new SpeechSynthesisUtterance(cleanText);
                utt.lang = 'de-DE';
                window.speechSynthesis.speak(utt);
            } catch (e) { resultBox.innerText = "Fehler: " + e.message; }
        }

        document.getElementById('send-btn').onclick = () => run(textInput.value);
        
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Rec) {
            const rec = new Rec(); rec.lang = 'de-DE';
            document.getElementById('voice-btn').onclick = () => rec.start();
            rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; run(textInput.value); };
        }
    </script>
</body>
</html>
