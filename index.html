<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- ENGINES -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d; --card-bg: #1a1a1a; --input-bg: #262626; --text: #f0f0f0;            
            --primary: #e3000f; --border-color: #333333; --accent: #00ff00;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { padding: 20px; text-align: center; width: 100%; border-bottom: 2px solid var(--border-color); background: rgba(13,13,13,0.9); }
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; }
        .intro-card { background: var(--card-bg); width: 100%; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); box-sizing: border-box; }
        
        /* RESULT BOX DESIGN */
        #result-container { width: 100%; margin-top: 20px; position: relative; }
        #result-box { 
            width: 100%; background: #000; padding: 20px; border-radius: 8px; 
            border: 1px solid var(--border-color); border-left: 4px solid var(--primary); 
            line-height: 1.6; min-height: 100px;
        }
        #result-box img { max-width: 100%; border-radius: 6px; margin: 15px 0; display: block; border: 1px solid #444; }
        #result-box pre { background: #151515 !important; padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid #333; }
        
        /* VORLESEN BUTTON */
        #speak-btn {
            display: none; position: absolute; top: 10px; right: 10px;
            background: var(--primary); color: white; border: none; 
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            box-shadow: 0 0 10px rgba(227, 0, 15, 0.5); z-index: 10;
        }
        #speak-btn.playing { background: var(--accent); animation: pulse 1.5s infinite; }

        .input-group { width: 100%; display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; padding: 15px; outline: none; }
        #text-input:focus { border-color: var(--primary); }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 55px; height: 55px; cursor: pointer; color: white; font-size: 1.4rem; transition: 0.2s; }
        .icon-btn:hover { border-color: var(--primary); }
        
        .btn-full { width: 100%; padding: 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-next { background: var(--primary); color: white; }
        .btn-back { background: #333; color: white; font-size: 0.8rem; }
        
        .loading { color: var(--primary); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; letter-spacing: 2px;">PHOENIX TUTOR</h1>
    </header>

    <div id="intro-screen" class="screen active">
        <div class="intro-card">
            <h2 style="margin-top:0;">🔑 Setup</h2>
            <p style="color: #999; font-size: 0.9rem;">Gib deinen Google AI Key ein:</p>
            <input type="password" id="api-key-input" placeholder="Paste API Key here..." style="width:100%; padding:12px; background:#000; color:var(--accent); border:1px solid #444; border-radius:4px; box-sizing: border-box; font-family: monospace;">
        </div>
        <button id="to-sim-btn" class="btn-full btn-next">Zum Simulator ➤</button>
    </div>

    <div id="simulator-screen" class="screen">
        <div class="intro-card" style="padding:10px;">
            <div class="iframe-container">
                <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb?editbtn=1"></iframe>
            </div>
        </div>
        <button id="to-camera-btn" class="btn-full btn-next">Hardware-Check ➤</button>
        <button id="back-to-intro-btn" class="btn-full btn-back">Zurück zum Setup</button>
    </div>

    <div id="tutor-screen" class="screen">
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag mich was...">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="voice-btn" class="icon-btn">🎤</button>
        </div>

        <div id="result-container">
            <button id="speak-btn" title="Vorlesen">🔊</button>
            <div id="result-box">BEREIT FÜR DEINE FRAGEN...</div>
        </div>
        
        <button id="back-to-sim-btn" class="btn-full btn-back" style="margin-top:30px;">Zurück zum Simulator</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Key Storage
        const keyInput = document.getElementById('api-key-input');
        if (localStorage.getItem('p_key')) keyInput.value = localStorage.getItem('p_key');
        keyInput.oninput = () => localStorage.setItem('p_key', keyInput.value);

        const video = document.getElementById('webcam');
        const resultBox = document.getElementById('result-box');
        const textInput = document.getElementById('text-input');
        const canvas = document.getElementById('canvas');
        const speakBtn = document.getElementById('speak-btn');
        let currentFullText = ""; // Speichert die Antwort für das Vorlesen
        let stream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('to-sim-btn').onclick = () => showScreen('simulator-screen');
        document.getElementById('to-camera-btn').onclick = async () => {
            showScreen('tutor-screen');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch(e) { resultBox.innerText = "Kamerafehler: " + e.message; }
        };
        document.querySelectorAll('.btn-back').forEach(b => b.onclick = () => {
            if(stream) stream.getTracks().forEach(t => t.stop());
            showScreen('intro-screen');
        });

        // --- TTS ENGINE ---
        function speakText() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                speakBtn.classList.remove('playing');
                return;
            }

            // BEREINIGUNG: Markdown Symbole entfernen
            let cleanText = currentFullText
                .replace(/!\[.*?\]\(.*?\)/g, "") // Bilder weg
                .replace(/```[\s\S]*?
```/g, " Ich habe dir den passenden Code in die Box geschrieben. ") // Code weg
                .replace(/[*#_`]/g, "") // Markdown Steuerzeichen weg
                .trim();

            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'de-DE';
            utterance.rate = 1.0;
            
            utterance.onstart = () => speakBtn.classList.add('playing');
            utterance.onend = () => speakBtn.classList.remove('playing');
            
            window.speechSynthesis.speak(utterance);
        }

        speakBtn.onclick = speakText;

        async function runTutor(q) {
            const key = localStorage.getItem('p_key');
            if (!key) return alert("Bitte zuerst den API-Key im Setup eingeben!");
            
            window.speechSynthesis.cancel();
            speakBtn.style.display = "none";
            resultBox.innerHTML = "<span class='loading'>Phoenix denkt nach...</span>";
            
            // Foto machen
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

            const systemPrompt = `Du bist der Phoenix Tutor. 
            Antworte kurz und schülerfreundlich auf Deutsch.
            Wenn nach Bauteilen gefragt wird: ![name](https://images.unsplash.com/featured/?[name]).
            Code immer in \`\`\`cpp \`\`\` Blöcken.
            Frage: ${q}`;

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                
                const result = await model.generateContent([
                    systemPrompt, 
                    { inlineData: { data: imgBase64, mimeType: "image/jpeg" } }
                ]);
                
                const responseText = await result.response.text();
                currentFullText = responseText;
                
                resultBox.innerHTML = marked.parse(responseText);
                Prism.highlightAllUnder(resultBox);
                
                // Vorlese-Button anzeigen
                speakBtn.style.display = "block";
                
            } catch (e) { 
                resultBox.innerText = "Fehler: " + e.message; 
            }
        }

        document.getElementById('send-btn').onclick = () => runTutor(textInput.value);
        textInput.onkeypress = (e) => { if(e.key === 'Enter') runTutor(textInput.value); };

        // Spracheingabe (Mikrofon)
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
            const recognition = new SpeechRec();
            recognition.lang = 'de-DE';
            document.getElementById('voice-btn').onclick = () => {
                recognition.start();
                resultBox.innerHTML = "<span class='loading'>Ich höre zu...</span>";
            };
            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                textInput.value = transcript;
                runTutor(transcript);
            };
        }
    </script>
</body>
</html>
