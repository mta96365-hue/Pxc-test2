<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tutor</title>
    
    <!-- EXTERNE ENGINES -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <style>
        :root { 
            --bg: #0d0d0d; --card-bg: #1a1a1a; --input-bg: #262626; --text: #f0f0f0;            
            --primary: #e3000f; --border-color: #333333; --accent: #00ff00;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { padding: 20px; text-align: center; width: 100%; border-bottom: 2px solid var(--border-color); background: rgba(13,13,13,0.9); box-sizing: border-box; }
        
        .screen { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; }
        
        .intro-card { background: var(--card-bg); width: 100%; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); box-sizing: border-box; }
        
        #result-container { width: 100%; margin-top: 20px; position: relative; }
        #result-box { 
            width: 100%; background: #000; padding: 20px; border-radius: 8px; 
            border: 1px solid var(--border-color); border-left: 4px solid var(--primary); 
            line-height: 1.6; min-height: 100px; box-sizing: border-box;
        }
        #result-box img { max-width: 100%; border-radius: 6px; margin: 15px 0; display: block; }
        
        #speak-btn {
            display: none; position: absolute; top: 10px; right: 10px;
            background: var(--primary); color: white; border: none; 
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            box-shadow: 0 0 10px rgba(227, 0, 15, 0.5); font-size: 1.2rem;
        }
        #speak-btn.playing { background: var(--accent); animation: pulse 1.5s infinite; }

        .input-group { width: 100%; display: flex; gap: 10px; margin-top: 20px; }
        #text-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; padding: 15px; outline: none; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 55px; height: 55px; cursor: pointer; color: white; font-size: 1.4rem; }
        
        .btn-full { width: 100%; padding: 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-next { background: var(--primary); color: white; }
        .btn-back { background: #333; color: white; font-size: 0.8rem; }
        
        #video-container { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .loading { color: var(--primary); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; letter-spacing: 2px;">PHOENIX TUTOR</h1>
        <div style="color: var(--primary); font-size: 0.8rem; font-weight: bold; margin-top: 5px;">SYS.MOD // VERSUCH 1: BLINK</div>
    </header>

    <!-- SCREEN 1: SETUP -->
    <div id="intro-screen" class="screen active">
        <div class="intro-card">
            <h2 style="margin-top:0;">🔑 Setup</h2>
            <p style="color: #999; font-size: 0.85rem;">API-Key eingeben (wird lokal gespeichert):</p>
            <input type="password" id="api-key-input" placeholder="Key hier einfügen..." style="width:100%; padding:12px; background:#000; color:var(--accent); border:1px solid #444; border-radius:4px; box-sizing: border-box; font-family: monospace;">
            <p style="margin-top:10px;"><a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: var(--primary); font-size: 0.8rem; text-decoration: none; font-weight: bold;">➔ Hier klicken: Kostenlosen Key holen</a></p>
        </div>
        
        <div class="intro-card">
            <h2 style="margin-top:0;">📋 Versuch: Blink</h2>
            <p style="font-size: 0.9rem; color: #ccc;"><strong>Ziel:</strong> Programmiere ein Blink-Signal.</p>
            <ul style="color: #999; font-size: 0.85rem; padding-left: 20px;">
                <li>Arduino Uno + USB</li>
                <li>LED + 220Ω Widerstand</li>
                <li>Breadboard & Kabel</li>
            </ul>
        </div>
        <button id="btn-goto-sim" class="btn-full btn-next">Zum Simulator ➤</button>
    </div>

    <!-- SCREEN 2: SIMULATOR -->
    <div id="simulator-screen" class="screen">
        <div class="intro-card" style="padding:10px;">
            <iframe src="https://www.tinkercad.com/embed/0qzHAwev1Hb?editbtn=1" style="width:100%; height:450px; border:none; border-radius:8px;"></iframe>
        </div>
        <button id="btn-goto-cam" class="btn-full btn-next">Hardware-Check ➤</button>
        <button id="btn-back-to-setup" class="btn-full btn-back">Zurück zum Setup</button>
    </div>

    <!-- SCREEN 3: TUTOR -->
    <div id="tutor-screen" class="screen">
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Frag Phoenix...">
            <button id="btn-send" class="icon-btn">➤</button>
            <button id="btn-mic" class="icon-btn">🎤</button>
        </div>
        <div id="result-container">
            <button id="speak-btn">🔊</button>
            <div id="result-box">WARTE AUF FRAGE...</div>
        </div>
        <button id="btn-back-to-sim" class="btn-full btn-back">Zurück zum Simulator</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Globale Variablen
        let videoStream = null;
        let lastResponse = "";

        // UI-Funktion
        function changeScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Kamera-Logik
        async function startCam() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam').srcObject = videoStream;
            } catch(e) { document.getElementById('result-box').innerText = "Kamerafehler: " + e.message; }
        }

        function stopCam() {
            if(videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
        }

        // Initialisierung nach dem Laden
        window.onload = () => {
            const keyField = document.getElementById('api-key-input');
            if (localStorage.getItem('p_key')) keyField.value = localStorage.getItem('p_key');
            keyField.oninput = () => localStorage.setItem('p_key', keyField.value);

            // NAVIGATION BUTTONS
            document.getElementById('btn-goto-sim').onclick = () => changeScreen('simulator-screen');
            document.getElementById('btn-back-to-setup').onclick = () => changeScreen('intro-screen');
            
            document.getElementById('btn-goto-cam').onclick = () => {
                changeScreen('tutor-screen');
                startCam();
            };

            document.getElementById('btn-back-to-sim').onclick = () => {
                stopCam();
                changeScreen('simulator-screen');
            };

            // KI & TTS
            document.getElementById('btn-send').onclick = () => runAI();
            document.getElementById('speak-btn').onclick = toggleTTS;

            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (Rec) {
                const r = new Rec(); r.lang = 'de-DE';
                document.getElementById('btn-mic').onclick = () => r.start();
                r.onresult = (e) => { 
                    document.getElementById('text-input').value = e.results[0][0].transcript; 
                    runAI(); 
                };
            }
        };

        async function runAI() {
            const k = localStorage.getItem('p_key');
            if (!k) return alert("Key fehlt!");
            
            const rb = document.getElementById('result-box');
            const ti = document.getElementById('text-input');
            const sb = document.getElementById('speak-btn');
            const vid = document.getElementById('webcam');
            const canv = document.getElementById('canvas');

            window.speechSynthesis.cancel();
            sb.style.display = "none";
            rb.innerHTML = "<span class='loading'>Phoenix denkt nach...</span>";
            
            canv.width = vid.videoWidth; canv.height = vid.videoHeight;
            canv.getContext('2d').drawImage(vid, 0, 0);
            const img = canv.toDataURL('image/jpeg', 0.7).split(',')[1];

            try {
                const genAI = new GoogleGenerativeAI(k);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const prompt = `Du bist Phoenix Tutor. Antworte kurz auf Deutsch. Bilder: ![name](https://images.unsplash.com/featured/?[name]). Code: \`\`\`cpp \`\`\`. Frage: ${ti.value}`;
                
                const res = await model.generateContent([prompt, { inlineData: { data: img, mimeType: "image/jpeg" } }]);
                lastResponse = await res.response.text();
                
                rb.innerHTML = marked.parse(lastResponse);
                Prism.highlightAllUnder(rb);
                sb.style.display = "block";
            } catch (e) { rb.innerText = "Fehler: " + e.message; }
        }

        function toggleTTS() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                document.getElementById('speak-btn').classList.remove('playing');
                return;
            }
            let clean = lastResponse.replace(/!\[.*?\]\(.*?\)/g, "").replace(/```[\s\S]*?```/g, "Code in Box.").replace(/[*#_`]/g, "").trim();
            const ut = new SpeechSynthesisUtterance(clean);
            ut.lang = 'de-DE';
            ut.onstart = () => document.getElementById('speak-btn').classList.add('playing');
            ut.onend = () => document.getElementById('speak-btn').classList.remove('playing');
            window.speechSynthesis.speak(ut);
        }
    </script>
</body>
</html>
